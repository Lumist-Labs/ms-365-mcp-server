name: Deploy Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "develop"

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      # Scoped to /tailscale, NOT the project root. A root recursive load
      # flattens every shared subfolder by bare key name, last-write-wins, and
      # /vps/gateway also defines VPS_SSH_KEY + VPS_TAILSCALE_IP — for a
      # different host. Whichever landed last won, so deploys failed at the SSH
      # handshake. /tailscale yields TAILSCALE_AUTHKEY, VPS_SSH_KEY and
      # VPS_TAILSCALE_IP uniquely, and matches vps-deploy-core's infra-path.
      - name: Load shared infra secrets from Infisical (OIDC)
        uses: aretecp/github-actions/actions/load-infisical-secrets@v2
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_SHARED_PROJECT_SLUG }}
          environment: dev
          path: /tailscale
          recursive: true

      - name: Load app secrets from Infisical (OIDC)
        uses: aretecp/github-actions/actions/load-infisical-secrets@v2
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_INTERNAL_PROJECT_SLUG }}
          environment: dev
          path: /m365-mcp

      - name: Join Tailscale
        uses: aretecp/github-actions/actions/tailscale-connect@v1
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_TAILSCALE_IP }}
          username: ${{ vars.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            REPO_DIR="$HOME/ms-365-mcp-server"

            # First-time clone guard — do not clobber existing prod checkout.
            # Same dir for prod and dev checkouts, as in areteos / areteos-py /
            # arilearn-phx. That means one compose project for both stacks, so
            # co-existence rests on the dev compose file using `-dev`-suffixed
            # SERVICE KEYS (not just container names — compose keys containers
            # by project+service). See docker-compose.dev.yml.
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Cloning ms-365-mcp-server into $REPO_DIR (first-time dev setup)..."
              git clone https://github.com/aretecp/ms-365-mcp-server.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
            echo "Deploying branch: $BRANCH"

            cat > .env.dev <<'ENVEOF'
            MICROSOFT_CLIENT_ID=${{ env.MICROSOFT_CLIENT_ID }}
            MICROSOFT_CLIENT_SECRET=${{ env.MICROSOFT_CLIENT_SECRET }}
            MICROSOFT_TENANT_ID=${{ env.MICROSOFT_TENANT_ID }}
            MS365_MCP_SESSION_KEY=${{ env.MS365_MCP_SESSION_KEY }}
            MS365_MCP_POLICY_ADMINS=${{ env.MS365_MCP_POLICY_ADMINS }}
            PUBLIC_HOSTNAME=m365.mcp.dev.areteintelligence.ai
            ENVIRONMENT=development
            ENVEOF
            chmod 600 .env.dev

            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            docker compose --env-file .env.dev -f docker-compose.dev.yml up -d --build

      # Was a `curl raw.githubusercontent.com/aretecp/...` piped to bash at the
      # end of the block above. That URL carries the GitHub org in its path and
      # does not follow the redirect a repo transfer leaves behind, so the org
      # move would have 404'd this health gate. H3 in ORG-MIGRATION.md.
      #
      # Paths are absolute because this is a fresh SSH session: the block above
      # had cd'd to the repo, so its relative `docker-compose.*.yml` worked.
      # Here it would not, and the only symptom would be a timeout with no
      # logs dumped — precisely when the logs matter.
      - name: Wait for containers to become healthy
        uses: aretecp/github-actions/actions/wait-for-healthy@v2
        with:
          host: ${{ env.VPS_TAILSCALE_IP }}
          username: ${{ vars.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          containers: m365_mcp_dev
          compose-file: /home/${{ vars.VPS_USER }}/ms-365-mcp-server/docker-compose.dev.yml
          env-file: /home/${{ vars.VPS_USER }}/ms-365-mcp-server/.env.dev
