name: Deploy Production

on:
  release:
    types: [published]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy (e.g. v1.2.3). Defaults to main."
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # Scoped to /tailscale, NOT the project root. A root recursive load
      # flattens every shared subfolder by bare key name, last-write-wins, and
      # /vps/gateway also defines VPS_SSH_KEY + VPS_TAILSCALE_IP — for a
      # different host. Whichever landed last won, so deploys failed at the SSH
      # handshake. /tailscale yields TAILSCALE_AUTHKEY, VPS_SSH_KEY and
      # VPS_TAILSCALE_IP uniquely, and matches vps-deploy-core's infra-path.
      - name: Load shared infra secrets from Infisical (OIDC)
        uses: aretecp/github-actions/actions/load-infisical-secrets@v2
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_SHARED_PROJECT_SLUG }}
          environment: prod
          path: /tailscale
          recursive: true

      - name: Load app secrets from Infisical (OIDC)
        uses: aretecp/github-actions/actions/load-infisical-secrets@v2
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_INTERNAL_PROJECT_SLUG }}
          environment: prod
          path: /m365-mcp

      - name: Join Tailscale
        uses: aretecp/github-actions/actions/tailscale-connect@v1
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        with:
          host: ${{ env.VPS_TAILSCALE_IP }}
          username: ${{ vars.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          envs: EXPECTED_REPO,GH_TOKEN
          command_timeout: 15m
          script: |
            set -euo pipefail
            REPO_DIR="$HOME/ms-365-mcp-server"

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "ERROR: $REPO_DIR does not exist. Prod deploy refuses to clone."
              echo "First-time bootstrap is manual — see docs/DEPLOYMENT.md §7.5."
              exit 1
            fi

            cd "$REPO_DIR"

            VERSION="${{ inputs.version || github.ref_name || 'main' }}"
            echo "Deploying version: $VERSION"

            cat > .env <<'ENVEOF'
            MICROSOFT_CLIENT_ID=${{ env.MICROSOFT_CLIENT_ID }}
            MICROSOFT_CLIENT_SECRET=${{ env.MICROSOFT_CLIENT_SECRET }}
            MICROSOFT_TENANT_ID=${{ env.MICROSOFT_TENANT_ID }}
            MS365_MCP_SESSION_KEY=${{ env.MS365_MCP_SESSION_KEY }}
            MS365_MCP_POLICY_ADMINS=${{ env.MS365_MCP_POLICY_ADMINS }}
            PUBLIC_HOSTNAME=m365.mcp.areteintelligence.ai
            ENVIRONMENT=production
            VERSION=${{ inputs.version || github.ref_name || 'main' }}
            ENVEOF
            chmod 600 .env


            # This checkout outlives an org move; its remote does not follow one,
            # and this workflow does not use vps-deploy-core so it gets none of
            # that action's protection. litellm-gateway's edge deploy — same
            # hand-rolled shape — died on exactly this after its transfer:
            # the redirect covers the web and `uses:`, not a private fetch, and
            # a private repo answers 404 rather than 403 so it reads as a bad URL.
            #
            # github.com only, scheme preserved: a self-hosted remote must not be
            # repointed at github.com, and a box on git@ has no https credential.
            CUR_URL=$(git remote get-url origin 2>/dev/null || echo "")
            case "$CUR_URL" in
              https://github.com/*) NEW_URL="https://github.com/$EXPECTED_REPO.git" ;;
              git@github.com:*)     NEW_URL="git@github.com:$EXPECTED_REPO.git" ;;
              *)                    NEW_URL="" ;;
            esac
            if [ -n "$NEW_URL" ]; then
              CUR_PATH=$(printf '%s' "$CUR_URL" | sed -E 's#^https://github\.com/##; s#^git@github\.com:##; s#\.git$##')
              if [ "$(printf '%s' "$CUR_PATH" | tr 'A-Z' 'a-z')" != "$(printf '%s' "$EXPECTED_REPO" | tr 'A-Z' 'a-z')" ]; then
                echo "origin is '$CUR_PATH' but this repo is '$EXPECTED_REPO' — repointing to $NEW_URL"
                git remote set-url origin "$NEW_URL"
              fi
            fi

            # The box's stored credential was made for the old org. Hand git the
            # job token via GIT_CONFIG_* so nothing lands in .git/config and the
            # helper reads $GH_TOKEN at exec time, keeping it off `ps`.
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="credential.helper"
            export GIT_CONFIG_VALUE_0='!f() { if test "$1" = get; then printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; fi; }; f'

            git fetch origin --tags --prune --force
            # Accept bare semver (1.8.0) as well as tag form (v1.8.0).
            if ! git show-ref --verify --quiet "refs/tags/$VERSION" && git show-ref --verify --quiet "refs/tags/v$VERSION"; then
              VERSION="v$VERSION"
              echo "Normalized to tag: $VERSION"
            fi
            # Detach to the fetched ref so branch deploys (e.g. VERSION=main)
            # never use a stale local branch tip. Works for both tags and branches.
            if git show-ref --verify --quiet "refs/tags/$VERSION"; then
              git checkout --force --detach "refs/tags/$VERSION"
            elif git show-ref --verify --quiet "refs/remotes/origin/$VERSION"; then
              git checkout --force --detach "origin/$VERSION"
            else
              echo "ERROR: '$VERSION' is neither a tag nor a remote branch. Aborting." >&2
              exit 1
            fi
            echo "Checked out: $(git rev-parse --short HEAD) ($(git log -1 --format=%s))"

            docker compose --env-file .env -f docker-compose.prod.yml up -d --build
            echo "Containers up for $VERSION; health gate runs next."

      # Own step, not a curl inside the block above: see ORG-MIGRATION.md H3.
      # Paths are absolute because this is a fresh SSH session — the block above
      # had cd'd to the repo, so its relative compose path worked and ours would
      # not. They are only read for the log dump on timeout.
      - name: Wait for containers to become healthy
        uses: aretecp/github-actions/actions/wait-for-healthy@v2
        with:
          host: ${{ env.VPS_TAILSCALE_IP }}
          username: ${{ vars.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          containers: m365_mcp
          compose-file: /home/${{ vars.VPS_USER }}/ms-365-mcp-server/docker-compose.prod.yml
          env-file: /home/${{ vars.VPS_USER }}/ms-365-mcp-server/.env
